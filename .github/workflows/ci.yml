name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor and the reason for tests/test_python310_compat.py:
        # a construct that works on 3.13 can still be a syntax error on 3.10.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parquet]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Examples run end to end on synthetic data only
        env:
          MPLBACKEND: Agg
        run: |
          python examples/end_to_end_synthetic.py
          python examples/reproduce_legacy_and_fix.py
          python examples/combiner_robustness.py --trials 10

  oldest-dependencies:
    # The declared floors have to be installable together, or ">=3.10" is a
    # promise the package cannot keep.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.24.*" "scipy==1.10.*" "scikit-learn==1.2.*" \
            "pandas==1.5.*" "matplotlib==3.6.*" "pyyaml==6.0.*" \
            "typer==0.12.*" "click==8.1.*" "joblib==1.2.*" pytest
          python -m pip install -e . --no-deps
      - env:
          MPLBACKEND: Agg
        run: python -m pytest -q
