# Three access points, one of them tampered with.
#
# These are the parameters recovered from the archived one-attack figure by
# solving for the settings that reproduce its curve peaks. The archived
# filename claimed the tampered AP reported -99 dBm; the curves say -90 dBm,
# which is what the -20 dB offset below produces from an honest -70 dBm.

scenario:
  name: one_attack
  aps:
    - {name: AP1, true_rssi_dbm: -70.0, sigma_db: 8.0}
    - {name: AP2, true_rssi_dbm: -70.0, sigma_db: 10.0}
    - {name: AP3, true_rssi_dbm: -70.0, sigma_db: 10.0}
  attacked_indices: [2]
  attack_offset_db: -20.0
  m_values: [0, 1, 2]
  combiner: esp

normalize:
  mode: sum
