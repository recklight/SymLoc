# Four access points, two of them tampered with.
#
# The original four-AP block gave every access point the same standard
# deviation. The parameters behind the archived two-attack figure were never
# recorded and cannot be recovered from the surviving code, so this is a
# reconstruction of the setting, not of that particular figure -- which is
# exactly why every run here writes a manifest.

scenario:
  name: two_attack
  aps:
    - {name: AP1, true_rssi_dbm: -70.0, sigma_db: 5.0}
    - {name: AP2, true_rssi_dbm: -70.0, sigma_db: 5.0}
    - {name: AP3, true_rssi_dbm: -70.0, sigma_db: 5.0}
    - {name: AP4, true_rssi_dbm: -70.0, sigma_db: 5.0}
  attacked_indices: [2, 3]
  attack_offset_db: -20.0
  m_values: [0, 1, 2, 3]
  combiner: esp

normalize:
  mode: sum
